<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image2 Flow</title>
    <link rel="stylesheet" href="./styles.css?v=16" />
  </head>
  <body data-theme="dark">
    <div class="app">
      <header class="topbar">
        <div class="titlebar">
          <div>
            <h1>API 2 Image</h1>
          </div>
        </div>

        <div class="top-actions">
          <button class="icon-button" id="themeButton" title="浅色/深色" type="button">
            <i data-icon="moon"></i>
          </button>
          <button class="icon-button" id="settingsToggle" title="API 设置" type="button">
            <i data-icon="settings"></i>
          </button>
          <button class="pill-button" id="logsToggle" type="button">
            <i data-icon="list"></i><span>生成日志</span>
          </button>
        </div>
      </header>

      <main class="gallery-shell">
        <section class="gallery-head">
          <div>
            <h2>生成结果</h2>
            <p id="resultMeta">生成后的图片会排列在这里</p>
          </div>
          <div class="gallery-tools">
            <button class="pill-button" id="clearResultsButton" type="button">
              <i data-icon="trash"></i><span>清空</span>
            </button>
          </div>
        </section>

        <section id="resultGrid" class="result-grid empty">
          <div class="empty-state">
            <h3>还没有图片</h3>
            <p>在底部输入提示词，上传参考图，选择模型和质量，然后生成。</p>
          </div>
        </section>
      </main>

      <section class="composer">
        <div id="referenceStrip" class="reference-strip" hidden></div>

        <div id="generationProgress" class="generation-progress" hidden>
          <div class="progress-copy">
            <strong id="progressTitle">准备生成</strong>
            <span id="progressDetail">正在提交请求</span>
          </div>
          <div class="progress-track">
            <div id="progressBar" class="progress-bar"></div>
          </div>
          <span id="progressCount">0/0</span>
          <span id="progressPercent">0%</span>
          <button class="progress-cancel" id="cancelGenerateButton" type="button" hidden>取消</button>
          <div id="currentLogPreview" class="current-log-preview" hidden></div>
        </div>

        <div class="prompt-card">
          <button class="add-button" id="uploadButton" title="上传参考图" type="button">
            <i data-icon="plus"></i>
          </button>

          <textarea id="promptInput" rows="1" placeholder="您希望创作什么内容？"></textarea>

          <div class="composer-actions">
            <select id="modelName" title="模型">
              <option value="gpt-image-2">gpt-image-2</option>
              <option value="gpt-image-1">gpt-image-1</option>
              <option value="dall-e-3">dall-e-3</option>
              <option value="flux">flux</option>
              <option value="midjourney">midjourney</option>
              <option value="nano-banana">Nano Banana</option>
              <option value="custom">自定义模型</option>
            </select>
            <button class="send-button" id="generateButton" title="生成" type="button">
              <i data-icon="arrow-right"></i>
            </button>
          </div>
        </div>

        <div class="control-row">
          <select id="modeSelect" title="生成模式">
            <option value="text">文生图</option>
            <option value="image">图生图</option>
          </select>
          <select id="ratioSelect" title="比例"></select>
          <select id="sizeSelect" title="尺寸"></select>
          <select id="countSelect" title="数量"></select>
          <select id="multiImageMode" title="多图方式">
            <option value="single">逐张稳定</option>
            <option value="batch">批量优先</option>
          </select>
          <select id="qualitySelect" title="质量"></select>
          <input id="negativePrompt" type="text" placeholder="反向提示词" />
          <input id="seedInput" type="number" placeholder="种子" />
        </div>
      </section>

      <aside id="settingsPanel" class="settings-panel">
        <div class="panel-header">
          <div>
            <h2>API 设置</h2>
            <p>如果生成出中转站 Logo，通常是 API URL 填成了网页地址或路径不对。</p>
          </div>
          <button class="icon-button" id="closeSettings" title="关闭" type="button">
            <i data-icon="x"></i>
          </button>
        </div>

        <label class="field">
          <span>文生图 API URL</span>
          <input id="textEndpoint" type="url" placeholder="https://.../v1/images/generations" />
        </label>
        <label class="field">
          <span>图生图 / 编辑 API URL</span>
          <input id="editEndpoint" type="url" placeholder="https://.../v1/images/edits" />
        </label>
        <label class="field">
          <span>API Key</span>
          <input id="apiKey" type="password" autocomplete="off" placeholder="sk-..." />
        </label>

        <div class="field-grid">
          <label class="field">
            <span>请求格式</span>
            <select id="requestFormat">
              <option value="openai">OpenAI 兼容</option>
              <option value="json">自定义 JSON</option>
            </select>
          </label>
          <label class="field">
            <span>请求方式</span>
            <select id="transportMode">
              <option value="direct">浏览器直连（推荐）</option>
              <option value="proxy">代理转发</option>
            </select>
          </label>
        </div>

        <label class="field" id="customTemplateField">
          <span>自定义 JSON 模板</span>
          <textarea id="customTemplate" rows="8"></textarea>
        </label>

        <label class="check-line">
          <input id="rememberKey" type="checkbox" />
          <span>记住密钥</span>
        </label>

        <div class="settings-actions">
          <button class="pill-button primary" id="saveConfigButton" type="button">
            <i data-icon="check"></i><span>保存配置</span>
          </button>
        </div>

        <section class="config-history">
          <div class="config-history-head">
            <h3>API 配置历史</h3>
            <span>点击即可切换</span>
          </div>
          <div id="configHistoryList" class="config-history-list"></div>
        </section>
      </aside>

      <aside id="logsPanel" class="logs-panel">
        <div class="panel-header">
          <div>
            <h2>生成日志</h2>
            <p>每次生成的请求参数、逐张提示词和 API 返回都会记录在这里。</p>
          </div>
          <button class="icon-button" id="closeLogs" title="关闭" type="button">
            <i data-icon="x"></i>
          </button>
        </div>
        <div class="logs-actions">
          <button class="pill-button" id="clearLogsButton" type="button">
            <i data-icon="trash"></i><span>清空日志</span>
          </button>
        </div>
        <div id="generationLogList" class="generation-log-list"></div>
      </aside>
    </div>

    <section id="detailModal" class="detail-modal" hidden>
      <div class="detail-stage">
        <header class="detail-top">
          <button class="icon-button" id="closeDetail" type="button" title="关闭">
            <i data-icon="arrow-left"></i>
          </button>
          <div>
            <h2 id="detailTitle">图片编辑</h2>
            <span id="detailPrompt"></span>
          </div>
          <div class="detail-actions">
            <button class="icon-button" id="favoriteButton" title="收藏" type="button"><i data-icon="heart"></i></button>
            <button class="icon-button" id="downloadDetail" title="下载" type="button"><i data-icon="download"></i></button>
            <button class="icon-button" id="reusePrompt" title="回填提示词" type="button"><i data-icon="rotate"></i></button>
            <button class="icon-button" id="deleteDetail" title="删除" type="button"><i data-icon="trash"></i></button>
            <button class="pill-button primary" id="doneDetail" type="button">完成</button>
          </div>
        </header>
        <div class="detail-body">
          <div id="detailViewport" class="detail-viewport">
            <img id="detailImage" alt="生成图片" draggable="false" />
          </div>
          <aside class="detail-side">
            <img id="detailThumb" alt="缩略图" />
            <p id="detailInfo"></p>
            <textarea id="editPromptInput" rows="4" placeholder="想要更改什么？"></textarea>
            <button class="pill-button primary" id="editGenerateButton" type="button">
              <i data-icon="sparkles"></i><span>基于此图再生成</span>
            </button>
          </aside>
        </div>
      </div>
    </section>

    <div id="toast" class="toast" hidden></div>
    <input id="imageInput" type="file" accept="image/*" multiple hidden />
    <script src="./app.js?v=24"></script>
  </body>
</html>
